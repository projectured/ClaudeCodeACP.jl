name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      # AgentClientProtocol is in ProjecturedRegistry, not in General.
      - name: Add the registries
        run: >-
          julia --color=yes -e 'using Pkg; Pkg.Registry.add("General");
          Pkg.Registry.add(url = "https://github.com/projectured/ProjecturedRegistry")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
